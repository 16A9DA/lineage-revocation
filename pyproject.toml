[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-revocation"
version = "0.1.0"
description = "Lineage-keyed verifier-side revocation for dynamically created agent delegation graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cbor2>=5.6",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
